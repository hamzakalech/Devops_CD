credentials:
  existingSecret: cloud-credentials
  useSecret: true
  name: cloud-credentials
  key: cloud

configuration:
  backupStorageLocation:
    - name: default
      provider: azure
      bucket: velero
      config:
        resourceGroup: hamza-resources
        storageAccount: velerobackup45298
        storageAccountKeyEnvVar: AZURE_STORAGE_ACCOUNT_ACCESS_KEY

  volumeSnapshotLocation:
    - name: default
      provider: azure
      config:
        resourceGroup: hamza-resources

initContainers:
  - name: velero-plugin-for-microsoft-azure
    image: velero/velero-plugin-for-microsoft-azure:v1.7.0
    volumeMounts:
      - mountPath: /target
        name: plugins


env:
  - name: AZURE_SUBSCRIPTION_ID
    value: 6126c082-d56e-4f42-8033-834a1072516c
  - name: AZURE_RESOURCE_GROUP
    value: hamza-resources

