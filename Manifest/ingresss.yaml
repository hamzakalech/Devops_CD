---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pievent-ingress
  namespace: hamzadevops
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod  # Uses Let's Encrypt for SSL
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
  - host: myapp.example.com  # Change to your domain
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: pievent-service
            port:
              number: 8083
      - path: /
        pathType: Prefix
        backend:
          service:
            name: angular-service
            port:
              number: 80
  tls:
  - hosts:
    - myapp.example.com  # Change to your domain
    secretName: myapp-tls  # TLS Secret created by Let's Encrypt
