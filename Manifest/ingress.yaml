---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pievent-ingress
  namespace: hamzadevops
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: pievent-service
            port:
              number: 8083
      - path: /
        pathType: Prefix
        backend:
          service:
            name: angular-service
            port:
              number: 80
