---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: eventmanagement-hpa
  namespace: hamzadevops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: eventmanagement
  minReplicas: 1
  maxReplicas: 150
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 65

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: angular-hpa
  namespace: hamzadevops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: angular-app
  minReplicas: 1
  maxReplicas: 150
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 65
