---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pievent-hpa
  namespace: hamzadevops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pievent
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: angular-hpa
  namespace: hamzadevops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: angular-app
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
